<svg style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" viewBox="0 0 680 300" role="img" aria-label="Lyophilisation : diagramme de phases" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="680" height="300"><rect x="0" y="0" width="680" height="300" rx="14" fill="#ffffff"></rect><path d="M70 250 H640" stroke-width="1.6" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(20, 26, 38);stroke-width:1.6px;marker-end:url(&quot;#fzar&quot;);"></path><path d="M70 250 V24" stroke-width="1.6" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(20, 26, 38);stroke-width:1.6px;marker-end:url(&quot;#fzar&quot;);"></path><text x="78.0" y="30.0" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;paint-order:stroke;">pression</text><text x="636.0" y="270.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:end;paint-order:stroke;">température →</text><path d="M80 244 Q200 220 290 170" stroke-width="3" fill="none" style="fill:none;stroke:rgb(124, 77, 219);stroke-width:3px;"></path><path d="M290 170 Q450 110 620 40" stroke-width="3" fill="none" style="fill:none;stroke:rgb(44, 102, 204);stroke-width:3px;"></path><path d="M290 170 L250 30" stroke-width="3" style="fill:rgb(0, 0, 0);stroke:rgb(15, 143, 126);stroke-width:3px;"></path><text x="150.0" y="70.0" text-anchor="middle" style="fill:rgb(58, 127, 213);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;">glace</text><text x="420.0" y="70.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;">eau liquide</text><text x="500.0" y="200.0" text-anchor="middle" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;">vapeur</text><circle cx="290" cy="170" r="7" style="fill:rgb(216, 72, 61);stroke:none;stroke-width:1px;"></circle><text x="302.0" y="188.0" text-anchor="start" style="fill:rgb(216, 72, 61);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12.5px;font-weight:800;paint-order:stroke;">point triple</text><g style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><circle cx="170.0" cy="110.0" r="11" stroke-width="2.5" style="fill:rgb(58, 127, 213);stroke:rgb(243, 246, 251);stroke-width:2.5px;"></circle><text x="170.0" y="114.5" text-anchor="middle" style="fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:900;text-anchor:middle;">1</text></g><text x="186.0" y="114.0" text-anchor="start" style="fill:rgb(58, 127, 213);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;paint-order:stroke;">congeler</text><path d="M170 124 V214" stroke-width="2.4" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(20, 26, 38);stroke-width:2.4px;marker-end:url(&quot;#fzar&quot;);"></path><text x="178.0" y="170.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;paint-order:stroke;">faire le vide :</text><text x="178.0" y="184.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;paint-order:stroke;">pression ↓</text><g style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><circle cx="170.0" cy="226.0" r="11" stroke-width="2.5" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:2.5px;"></circle><text x="170.0" y="230.5" text-anchor="middle" style="fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:900;text-anchor:middle;">2</text></g><path d="M186 226 H420" stroke-width="3" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(124, 77, 219);stroke-width:3px;marker-end:url(&quot;#fzar&quot;);"></path><text x="300.0" y="242.0" text-anchor="middle" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:middle;paint-order:stroke;">sublimation : glace → vapeur</text><g style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><circle cx="436.0" cy="226.0" r="11" stroke-width="2.5" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:2.5px;"></circle><text x="436.0" y="230.5" text-anchor="middle" style="fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:900;text-anchor:middle;">3</text></g><text x="340.0" y="288.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">sous le point triple, la glace devient vapeur sans fondre</text></svg>