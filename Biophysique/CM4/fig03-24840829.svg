<svg style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" viewBox="0 0 680 250" role="img" aria-label="Les forces sur une protéine qui migre" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="680" height="250"><rect x="0" y="0" width="680" height="250" rx="14" fill="#ffffff"></rect><rect x="20" y="40" width="40" height="150" rx="6" opacity=".3" style="fill:rgb(44, 102, 204);stroke:rgb(44, 102, 204);stroke-width:1px;opacity:0.3;"></rect><text x="40.0" y="30.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:middle;paint-order:stroke;">cathode −</text><rect x="620" y="40" width="40" height="150" rx="6" opacity=".3" style="fill:rgb(216, 72, 61);stroke:rgb(216, 72, 61);stroke-width:1px;opacity:0.3;"></rect><text x="640.0" y="30.0" text-anchor="middle" style="fill:rgb(216, 72, 61);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:middle;paint-order:stroke;">anode +</text><circle cx="340" cy="115" r="30" opacity=".85" style="fill:rgb(124, 77, 219);stroke:none;stroke-width:1px;opacity:0.85;"></circle><text x="340" y="120" text-anchor="middle" style="fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;font-size:13px;font-weight:700;text-anchor:middle;">Ze (−)</text><path d="M372 115 H540" stroke-width="5" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(216, 72, 61);stroke-width:5px;marker-end:url(&quot;#fzar&quot;);"></path><text x="456.0" y="104.0" text-anchor="middle" style="fill:rgb(216, 72, 61);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">Fe = Z·e·E</text><text x="456.0" y="140.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">le champ la tire</text><path d="M308 115 H140" stroke-width="5" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(44, 102, 204);stroke-width:5px;marker-end:url(&quot;#fzar&quot;);"></path><text x="224.0" y="104.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">Ff = 6π·η·r·v</text><text x="224.0" y="140.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">le support la freine</text><rect x="150" y="176" width="380" height="64" rx="12" style="fill:rgb(255, 255, 255);stroke:rgb(230, 223, 210);stroke-width:1px;"></rect><text x="340.0" y="198.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;text-anchor:middle;paint-order:stroke;">vitesse constante quand Fe = Ff : v = ZeE / 6πηr</text><text x="340.0" y="222.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">charge ↑ ou champ ↑ : plus vite · rayon ↑ ou viscosité ↑ : plus lent</text></svg>