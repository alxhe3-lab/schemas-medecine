<svg style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" viewBox="0 0 680 230" role="img" aria-label="Observation et expérience" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="680" height="230"><rect x="0" y="0" width="680" height="230" rx="14" fill="#ffffff"></rect><rect x="8" y="8" width="264" height="180" rx="14" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(15, 143, 126);stroke-width:2px;"></rect><text x="140.0" y="32.0" text-anchor="middle" style="fill:rgb(15, 143, 126);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;">observation</text><text x="140.0" y="170.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">on regarde, sans toucher</text><path d="M68 96 Q90 78 112 96 Q90 114 68 96Z" stroke-width="1.4" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:1.4px;"></path><circle cx="90" cy="96" r="8" style="fill:rgb(15, 143, 126);stroke:none;stroke-width:1px;"></circle><circle cx="90" cy="96" r="3.4" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></circle><circle cx="180" cy="96" r="22" opacity=".7" style="fill:rgb(31, 157, 85);stroke:none;stroke-width:1px;opacity:0.7;"></circle><rect x="408" y="8" width="264" height="180" rx="14" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(44, 102, 204);stroke-width:2px;"></rect><text x="540.0" y="32.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;">expérience</text><text x="540.0" y="170.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">on provoque, on mesure</text><path d="M468 96 Q490 78 512 96 Q490 114 468 96Z" stroke-width="1.4" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:1.4px;"></path><circle cx="490" cy="96" r="8" style="fill:rgb(44, 102, 204);stroke:none;stroke-width:1px;"></circle><circle cx="490" cy="96" r="3.4" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></circle><circle cx="580" cy="96" r="22" opacity=".7" style="fill:rgb(31, 157, 85);stroke:none;stroke-width:1px;opacity:0.7;"></circle><path d="M530 60 l30 26" stroke-width="3" style="fill:rgb(0, 0, 0);stroke:rgb(20, 26, 38);stroke-width:3px;"></path><path d="M558 84 l8 6" stroke-width="5" style="fill:rgb(0, 0, 0);stroke:rgb(216, 72, 61);stroke-width:5px;"></path><rect x="610" y="70" width="16" height="50" rx="8" style="fill:rgb(243, 246, 251);stroke:rgb(20, 26, 38);stroke-width:1px;"></rect><rect x="614" y="96" width="8" height="20" style="fill:rgb(216, 72, 61);stroke:none;stroke-width:1px;"></rect><path d="M280 98 H400" stroke-width="2.6" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(20, 26, 38);stroke-width:2.6px;marker-end:url(&quot;#fzar&quot;);"></path><text x="340.0" y="88.0" text-anchor="middle" style="fill:rgb(216, 72, 61);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:middle;paint-order:stroke;">+ une intervention</text><text x="340.0" y="216.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">« L'expérience est une observation provoquée » (Claude Bernard)</text></svg>