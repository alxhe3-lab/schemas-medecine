<svg style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" viewBox="0 0 680 320" role="img" aria-label="Les 7 unités de base du SI" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="680" height="320"><rect x="0" y="0" width="680" height="320" rx="14" fill="#ffffff"></rect><rect x="8" y="8" width="160" height="140" rx="14" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(15, 143, 126);stroke-width:2px;"></rect><circle cx="88" cy="52" r="28" style="fill:rgb(15, 143, 126);stroke:none;stroke-width:1px;"></circle><text x="88" y="60" text-anchor="middle" style="fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;font-size:22px;font-weight:800;text-anchor:middle;">s</text><text x="88.0" y="100.0" text-anchor="middle" style="fill:rgb(15, 143, 126);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:14px;font-weight:800;text-anchor:middle;paint-order:stroke;">seconde</text><text x="88.0" y="118.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">durée</text><text x="88.0" y="135.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:10.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">césium 133</text><rect x="176" y="8" width="160" height="140" rx="14" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(44, 102, 204);stroke-width:2px;"></rect><circle cx="256" cy="52" r="28" style="fill:rgb(44, 102, 204);stroke:none;stroke-width:1px;"></circle><text x="256" y="60" text-anchor="middle" style="fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;font-size:22px;font-weight:800;text-anchor:middle;">m</text><text x="256.0" y="100.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:ro