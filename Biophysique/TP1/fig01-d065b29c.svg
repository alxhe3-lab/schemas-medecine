e" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:10.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">source monochromatique</text><rect x="512" y="158" width="160" height="140" rx="14" stroke-width="1.6" stroke-dasharray="5 4" style="fill:rgb(243, 246, 251);stroke:rgb(216, 72, 61);stroke-width:1.6px;stroke-dasharray:5px, 4px;"></rect><text x="592.0" y="186.0" text-anchor="middle" style="fill:rgb(167, 47, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;text-anchor:middle;paint-order:stroke;">pièges</text><text x="592.0" y="214.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">kilogramme, pas gramme</text><text x="592.0" y="234.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">K majuscule, sans °</text><text x="592.0" y="254.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">cd = lumière</text><text x="592.0" y="274.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">A = courant</text><text x="340.0" y="314.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">une constante de la nature fixe chaque unité (pas besoin des chiffres)</text></svg>