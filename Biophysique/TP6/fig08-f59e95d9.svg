<svg viewBox="0 0 600 220" role="img" aria-label="Étalonnage du carré oculaire" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="600" height="220"><rect x="0" y="0" width="600" height="220" rx="14" fill="#ffffff"></rect> <rect x="60" y="30" width="200" height="120" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></rect><path d="M100 30 V150 M140 30 V150 M180 30 V150 M220 30 V150 M60 70 H260 M60 110 H260" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;"></path> <path d="M60 170 V200 M80 180 V200 M100 170 V200 M120 180 V200 M140 170 V200 M160 180 V200 M180 170 V200" style="fill:none;stroke:rgb(20, 120, 168);stroke-width:3px;"></path> <text x="60" y="216" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;">micromètre objectif : 10 μm par trait</text><text x="160" y="24" text-anchor="middle" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;text-anchor:middle;">carré du micromètre oculaire</text> <circle cx="300" cy="60" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="300" y="65" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">1</text><text x="320" y="65" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;">1 petit carré = 2 traits = 20 μm</text> <circle cx="300" cy="110" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="300" y="115" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">2</text><text x="320" y="115" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;">la cellule fait 2,5 carreaux</text> <circle cx="300" cy="160" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="300" y="165" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">3</text><text x="320" y="165" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;">diamètre = 2,5 × 20 = 50 μm</text></svg>