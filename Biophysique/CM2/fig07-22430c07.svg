<svg style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" viewBox="0 0 680 300" role="img" aria-label="Du dépistage au cancer" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="680" height="300"><rect x="0" y="0" width="680" height="300" rx="14" fill="#ffffff"></rect><path d="M60.0 14 H620.0 L590.0 60 H90.0z" opacity="0.15" stroke-width="1.6" style="fill:rgb(44, 102, 204);stroke:rgb(44, 102, 204);stroke-width:1.6px;opacity:0.15;"></path><text x="340.0" y="36.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;">100 000</text><text x="340.0" y="52.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">enfants dépistés</text><path d="M110.0 68 H570.0 L540.0 114 H140.0z" opacity="0.3" stroke-width="1.6" style="fill:rgb(44, 102, 204);stroke:rgb(44, 102, 204);stroke-width:1.6px;opacity:0.3;"></path><text x="340.0" y="90.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;">40 %</text><text x="340.0" y="106.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">anomalies de la thyroïde</text><path d="M160.0 122 H520.0 L490.0 168 H190.0z" opacity="0.44" stroke-width="1.6" style="fill:rgb(44, 102, 204);stroke:rgb(44, 102, 204);stroke-width:1.6px;opacity:0.45;"></path><text x="340.0" y="144.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;">501</text><text x="340.0" y="160.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">nodules de plus de 5 mm</text><path d="M210.0 176 H470.0 L440.0 222 H240.0z" opacity="0.6" stroke-width="1.6" style="fill:rgb(44, 102, 204);stroke:rgb(44, 102, 204);stroke-width:1.6px;opacity:0.6;"></path><text x="340.0" y="198.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;">109</text><text x="340.0" y="214.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">examens complémentaires</text><path d="M260.0 230 H420.0 L390.0 276 H290.0z" opacity="0.75" stroke-width="1.6" style="fill:rgb(216, 72, 61);stroke:rgb(216, 72, 61);stroke-width:1.6px;opacity:0.75;"></path><text x="340.0" y="252.0" text-anchor="middle" style="fill:rgb(216, 72, 61);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:15px;font-weight:800;text-anchor:middle;paint-order:stroke;">1</text><text x="340.0" y="268.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">cancer de la thyroïde</text><text x="20.0" y="290.0" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;paint-order:stroke;">à chaque étape, moins d'enfants</text></svg>