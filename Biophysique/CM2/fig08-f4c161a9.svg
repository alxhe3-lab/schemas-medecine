ologique</text><text x="510.0" y="200.0" text-anchor="middle" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">équivalent de dose : sievert (Sv)</text><text x="510.0" y="218.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:middle;paint-order:stroke;">Sv = Gy × Q × N</text><text x="510.0" y="236.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11px;font-weight:800;text-anchor:middle;paint-order:stroke;">ancienne : rem</text></svg>