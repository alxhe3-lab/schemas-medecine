<svg viewBox="0 0 600 260" role="img" aria-label="Trois lignes de défense, de dehors en dedans" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="600" height="260"><rect x="0" y="0" width="600" height="260" rx="14" fill="#ffffff"></rect><rect x="10" y="20" width="580" height="220" rx="20" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><rect x="60" y="56" width="480" height="168" rx="18" style="fill:rgb(241, 234, 250);stroke:rgb(116, 66, 184);stroke-width:2px;"></rect><rect x="130" y="96" width="340" height="114" rx="16" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><text x="300" y="44" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">① facteurs externes : peau, mucus, larmes, acides</text><text x="300" y="82" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">② facteurs internes : complément, lysozyme, phagocytes</text><text x="300" y="124" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">③ immunité spécifique</text><text x="300" y="148" text-anchor="middle" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;text-anchor:middle;">lymphocytes B et T</text><text x="300" y="170" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">lente, ciblée, avec mémoire</text><circle cx="40" cy="140" r="9" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></circle><path d="M52 140 L118.0 140.0" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.2px;stroke-linecap:round;stroke-linejoin:round;"></path><path d=