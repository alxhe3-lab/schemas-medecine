<svg viewBox="0 0 600 250" role="img" aria-label="Les trois étapes de l'hémostase dans le temps" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="600" height="250"><rect x="0" y="0" width="600" height="250" rx="14" fill="#ffffff"></rect><text x="20" y="30" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">temps après la blessure →</text><rect x="20" y="60" width="140" height="34" rx="8" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="90" y="82" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">primaire</text><text x="90" y="112" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;text-anchor:middle;">3 à 5 min</text><rect x="130" y="124" width="200" height="34" rx="8" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><text x="230" y="146" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">secondaire</text><text x="230" y="176" text-anchor="middle" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;text-anchor:middle;">5 à 10 min</text><rect x="350" y="60" width="230" height="34" rx="8" style="fill:rgb(241, 234, 250);stroke:rgb(116, 66, 184);stroke-width:2px;"></rect><text x="465" y="82" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">fibrinolyse</text><text x="465" y="112" text-anchor="middle" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;text-anchor:middle;">48 à 72 h</text><path d="M20 200 H330" style="fill:none;stroke:rgb(37, 71, 