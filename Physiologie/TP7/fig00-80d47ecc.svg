<svg viewBox="0 0 640 250" role="img" aria-label="Un tube de sang, trois mesures" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="250"><rect x="0" y="0" width="640" height="250" rx="14" fill="#ffffff"></rect> <rect x="40" y="40" width="44" height="160" rx="18" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></rect><rect x="44" y="110" width="36" height="86" rx="14" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><text x="62" y="30" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">prise de sang</text><text x="62" y="225" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">+ anticoagulant</text> <path d="M95 120 C150 120 150 50 200 50" style="fill:none;stroke:rgb(94, 102, 119);stroke-width:1.3px;"></path><path d="M196 44 l10 6 l-10 6 z" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></path> <path d="M95 120 H200" style="fill:none;stroke:rgb(94, 102, 119);stroke-width:1.3px;"></path><path d="M196 114 l10 6 l-10 6 z" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></path> <path d="M95 120 C150 120 150 195 200 195" style="fill:none;stroke:rgb(94, 102, 119);stroke-width:1.3px;"></path><path d="M196 189 l10 6 l-10 6 z" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></path> <rect x="214" y="26" width="404" height="50" rx="12" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="230" y="48" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">③ Hématocrite</text><text x="230" y="66" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">on centrifuge : % du sang occupé par les hématies</text> <rect x="214" y="96" width="404" height="50" rx="12" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><text x="230" y="118" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">④ VSH</text><text x="230" y="136" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">on laisse tomber 1 heure : mm de plasma clair</text> <rect x="214" y="166" width="404" height="50" rx="12" style="fill:rgb(241, 234, 250);stroke:rgb(116, 66, 184);stroke-width:2px;"></rect><text x="230" y="188" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">⑤ Numération</text><text x="230" y="206" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">on dilue et on compte au microscope : millions/mm³</text></svg>