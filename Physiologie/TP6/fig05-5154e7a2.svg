<svg viewBox="0 0 600 220" role="img" aria-label="Durée de la contraction lisse" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="600" height="220"><rect x="0" y="0" width="600" height="220" rx="14" fill="#ffffff"></rect> <path d="M40 170 H580 M40 30 V170" style="fill:none;stroke:rgb(94, 102, 119);stroke-width:1.3px;"></path><text x="580" y="194" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:end;">temps (s)</text> <path d="M40 168 H70 C90 168 100 60 130 50 C170 44 210 80 260 130 C300 160 330 168 380 168" style="fill:none;stroke:rgb(37, 71, 166);stroke-width:3px;"></path> <path d="M40 168 H46 C50 120 56 100 60 100 C66 100 70 150 80 168" style="fill:none;stroke:rgb(20, 120, 168);stroke-width:3px;"></path> <circle cx="70" cy="190" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="70" y="195" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">1</text> <circle cx="130" cy="30" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="130" y="35" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">2</text> <circle cx="300" cy="140" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="300" y="145" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">3</text> <text x="8" y="88" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">squelettique</text><text x="200" y="60" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">lisse : 1 à 3 s au t