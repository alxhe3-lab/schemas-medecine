<svg viewBox="0 0 420 250" role="img" aria-label="Durées du transit" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="420" height="250"><rect x="0" y="0" width="420" height="250" rx="14" fill="#ffffff"></rect> <path d="M20 120 H400" style="fill:none;stroke:rgb(94, 102, 119);stroke-width:1.3px;"></path><path d="M400 114 l10 6 l-10 6 z" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></path> <rect x="20" y="96" width="30" height="48" rx="8" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><rect x="52" y="96" width="44" height="48" rx="8" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><rect x="98" y="96" width="120" height="48" rx="8" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><rect x="220" y="96" width="176" height="48" rx="8" style="fill:rgb(241, 234, 250);stroke:rgb(116, 66, 184);stroke-width:2px;"></rect> <circle cx="35" cy="76" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="35" y="81" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">1</text><text x="20" y="40" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">bouche :</text><text x="20" y="56" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">secondes</text> <circle cx="74" cy="164" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="74" y="169" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">2</text><text x="52" y="196" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">estomac</text><text x="52" y="212" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">2–3 h</text> <circle cx="158" cy="76" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="158" y="81" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">3</text><text x="120" y="40" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">grêle</text><text x="120" y="56" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">≈ 12 h</text> <circle cx="308" cy="164" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="308" y="169" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">4</text><text x="250" y="196" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">côlon, rectum</text><text x="250" y="212" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">le plus long</text> <text x="210" y="244" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">total ≈ 48 h (2 jours)</text></svg>