<svg style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" viewBox="0 0 680 330" role="img" aria-label="Pourquoi le repos est proche de E K" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="680" height="330"><rect x="0" y="0" width="680" height="330" rx="14" fill="#ffffff"></rect><rect x="140" y="40.0" width="20" height="266.0" rx="10" style="fill:rgb(255, 255, 255);stroke:rgb(94, 102, 119);stroke-width:1px;"></rect><path d="M136 68.0 h-8" style="fill:rgb(0, 0, 0);stroke:rgb(94, 102, 119);stroke-width:1px;"></path><text x="124.0" y="72.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11px;font-weight:800;text-anchor:end;paint-order:stroke;">+60</text><path d="M136 152.0 h-8" style="fill:rgb(0, 0, 0);stroke:rgb(94, 102, 119);stroke-width:1px;"></path><text x="124.0" y="156.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11px;font-weight:800;text-anchor:end;paint-order:stroke;">0</text><path d="M136 222.0 h-8" style="fill:rgb(0, 0, 0);stroke:rgb(94, 102, 119);stroke-width:1px;"></path><text x="124.0" y="226.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11px;font-weight:800;text-anchor:end;paint-order:stroke;">−50</text><path d="M136 292.0 h-8" style="fill:rgb(0, 0, 0);stroke:rgb(94, 102, 119);stroke-width:1px;"></path><text x="124.0" y="296.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11px;font-weight:800;text-anchor:end;paint-order:stroke;">−100</text><path d="M138 58.2 h24" stroke-width="4" style="fill:rgb(0, 0, 0);stroke:rgb(15, 143, 126);stroke-width:4px;"></path><text x="170.0" y="63.2" text-anchor="start" style="fill:rgb(15, 143, 126);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;paint-order:stroke;">E Na ≈ +67 mV</text><path d="M138 285.0 h24" stroke-width="4" style="fill:rgb(0, 0, 0);stroke:rgb(124, 77, 219);stroke-width:4px;"></path><text x="170.0" y="290.0" text-anchor="start" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;paint-order:stroke;">E K ≈ −95 mV</text><circle cx="150" cy="250.0" r="11" stroke-width="2.5" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:2.5px;"></circle><text x="170.0" y="252.0" text-anchor="start" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;paint-order:stroke;">repos du neurone ≈ −70 mV</text><text x="170.0" y="267.0" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11px;font-weight:800;paint-order:stroke;">(muscle, cœur : ≈ −90)</text><path d="M132 244.0 C90 210.0 90 68.0 134 58.2" stroke-width="2" fill="none" stroke-dasharray="5 4" style="fill:none;stroke:rgb(15, 143, 126);stroke-width:2px;stroke-dasharray:5px, 4px;"></path><path d="M132 256.0 C100 270.0 100 278.0 134 285.0" stroke-width="6" fill="none" style="fill:none;stroke:rgb(124, 77, 219);stroke-width:6px;"></path><text x="84.0" y="124.0" text-anchor="end" style="fill:rgb(15, 143, 126);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:end;paint-order:stroke;">Na⁺ tire</text><text x="84.0" y="143.6" text-anchor="end" style="fill:rgb(15, 143, 126);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:end;paint-order:stroke;">(peu)</text><text x="92.0" y="269.6" text-anchor="end" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:end;paint-order:stroke;">K⁺ tire</text><text x="92.0" y="289.2" text-anchor="end" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:end;paint-order:stroke;">(fort)</text><rect x="372" y="40" width="300" height="104" rx="14" style="fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;"></rect><text x="386.0" y="64.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;paint-order:stroke;">Au repos, la membrane laisse</text><text x="386.0" y="80.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;paint-order:stroke;">surtout passer K⁺ (canaux de fuite)</text><text x="386.0" y="104.0" text-anchor="start" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;paint-order:stroke;">→ le repos est tout près de E K</text><text x="386.0" y="124.0" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;paint-order:stroke;">→ il dépend du K⁺ du sang</text><rect x="372" y="160" width="300" height="150" rx="14" opacity=".5" style="fill:rgb(250, 220, 215);stroke:none;stroke-width:1px;opacity:0.5;"></rect><text x="386.0" y="184.0" text-anchor="start" style="fill:rgb(167, 47, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;paint-order:stroke;">Hyperkaliémie (K⁺ ↑ dans le sang)</text><text x="386.0" y="208.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;paint-order:stroke;">E K moins négatif</text><text x="386.0" y="227.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;paint-order:stroke;">→ le repos remonte (dépolarisation)</text><text x="386.0" y="246.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;paint-order:stroke;">→ les Nav s'inactivent</text><text x="386.0" y="265.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;paint-order:stroke;">→ excitabilité ↓ : faiblesse,</text><text x="386.0" y="284.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;paint-order:stroke;">troubles du rythme, arrêt cardiaque</text></svg>