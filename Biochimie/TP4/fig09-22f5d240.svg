<svg style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" viewBox="0 0 680 260" role="img" aria-label="Comment agissent les anticoagulants" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="680" height="260"><rect x="0" y="0" width="680" height="260" rx="14" fill="#ffffff"></rect><rect x="8" y="8" width="320" height="200" rx="14" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(15, 143, 126);stroke-width:2px;"></rect><text x="168.0" y="32.0" text-anchor="middle" style="fill:rgb(15, 143, 126);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:14px;font-weight:800;text-anchor:middle;paint-order:stroke;">ils captent le calcium</text><text x="168.0" y="50.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">EDTA · citrate · oxalate</text><circle cx="88" cy="120" r="12" style="fill:rgb(228, 173, 18);stroke:rgb(168, 124, 0);stroke-width:1px;"></circle><text x="88" y="124" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:10px;font-weight:700;text-anchor:middle;">Ca²⁺</text><path d="M64 100 q-6 20 6 40 M112 100 q6 20 -6 40" stroke-width="5" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(15, 143, 126);stroke-width:5px;stroke-linecap:round;"></path><circle cx="168" cy="120" r="12" style="fill:rgb(228, 173, 18);stroke:rgb(168, 124, 0);stroke-width:1px;"></circle><text x="168" y="124" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:10px;font-weight:700;text-anchor:middle;">Ca²⁺</text><path d="M144 100 q-6 20 6 40 M192 100 q6 20 -6 40" stroke-width="5" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(15, 143, 126);stroke-width:5px;stroke-linecap:round;"></path><circle cx="248" cy="120" r="12" style="fill:rgb(228, 173, 18);stroke:rgb(168, 124, 0);stroke-width:1px;"></circle><text x="248" y="124" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:10px;font-weight:700;text-anchor:middle;">Ca²⁺</text><path d="M224 100 q-6 20 6 40 M272 100 q6 20 -6 40" stroke-width="5" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(15, 143, 126);stroke-width:5px;stroke-linecap:round;"></path><text x="168.0" y="174.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:middle;paint-order:stroke;">sans calcium, pas de coagulation</text><rect x="344" y="8" width="320" height="200" rx="14" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(44, 102, 204);stroke-width:2px;"></rect><text x="504.0" y="32.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:14px;font-weight:800;text-anchor:middle;paint-order:stroke;">elle bloque la thrombine</text><text x="504.0" y="50.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">héparine (+ antithrombine III)</text><path d="M454 120 L483.4 137.0 A34 34 0 1 1 483.4 103.0Z" opacity=".9" style="fill:rgb(216, 72, 61);stroke:none;stroke-width:1px;opacity:0.9;"></path><text x="454.0" y="176.0" text-anchor="middle" style="fill:rgb(167, 47, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:middle;paint-order:stroke;">thrombine</text><rect x="474" y="108" width="40" height="24" rx="6" style="fill:rgb(44, 102, 204);stroke:none;stroke-width:1px;"></rect><g style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><path d="M511.5 97.0 v-4 a4.5 4.5 0 0 1 9 0 v4" stroke-width="2.4" fill="none" stroke-linecap="round" style="fill:none;stroke:rgb(44, 1