gb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:14px;font-weight:800;text-anchor:middle;paint-order:stroke;">−1/Km</text><text x="150.0" y="242.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11px;font-weight:800;text-anchor:middle;paint-order:stroke;">(sur l'axe horizontal)</text><rect x="64" y="26" width="214" height="94" rx="12" style="fill:rgb(255, 255, 255);stroke:rgb(230, 223, 210);stroke-width:1px;"></rect><text x="76.0" y="46.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12.5px;font-weight:800;paint-order:stroke;">Exemple du test :</text><text x="76.0" y="66.0" text-anchor="start" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;paint-order:stroke;">ordonnée 0,10 → Vmax = 1/0,10 = 10</text><text x="76.0" y="84.0" text-anchor="start" style="fill:rgb(15, 143, 126);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;paint-order:stroke;">abscisse −0,04 → Km = 1/0,04</text><text x="76.0" y="102.0" text-anchor="start" style="fill:rgb(15, 143, 126);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;paint-order:stroke;">= 25 µM ; pente = 25/10 = 2,5</text><path d="M520 101.3 H600 V80.0" stroke-width="2" fill="none" style="fill:none;stroke:rgb(216, 72, 61);stroke-width:2px;"></path><text x="606.0" y="112.7" text-anchor="end" style="fill:rgb(167, 47, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12.5px;font-weight:800;text-anchor:end;paint-order:stroke;">pente = Km/Vmax</text></svg>