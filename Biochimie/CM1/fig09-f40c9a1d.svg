<svg style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" viewBox="0 0 680 330" role="img" aria-label="Que signifie chaque flèche" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="680" height="330"><rect x="0" y="0" width="680" height="330" rx="14" fill="#ffffff"></rect><rect x="8" y="10" width="664" height="54" rx="12" style="fill:rgb(255, 255, 255);stroke:rgb(230, 223, 210);stroke-width:1px;"></rect><circle cx="40" cy="42" r="5" style="fill:rgb(58, 127, 213);stroke:none;stroke-width:1px;"></circle><circle cx="52" cy="42" r="5" style="fill:rgb(58, 127, 213);stroke:none;stroke-width:1px;"></circle><path d="M46 34 Q100 4 150 36" stroke-width="3" fill="none" marker-end="url(#fzar)" style="fill:none;stroke:rgb(44, 102, 204);stroke-width:3px;marker-end:url(&quot;#fzar&quot;);"></path><text x="180.0" y="34.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;paint-order:stroke;">courbe, pointe pleine</text><text x="180.0" y="52.0" text-anchor="start" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;paint-order:stroke;">déplace 2 électrons</text><text x="660.0" y="42.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:end;paint-order:stroke;">un doublet (2 points) bouge</text><rect x="8" y="72" width="664" height="54" rx="12" style="fill:rgb(255, 255, 255);stroke:rgb(230, 223, 210);stroke-width:1px;"></rect><circle cx="46" cy="104" r="5" style="fill:rgb(58, 127, 213);stroke:none;stroke-width:1px;"></circle><path d="M46 96 Q100 66 150 98" stroke-width="3" fill="none" style="fill:none;stroke:rgb(15, 143, 126);stroke-width:3px;"></path><path d="M150 98 l-12 -2 l2 -6z" style="fill:rgb(15, 143, 126);stroke:none;stroke-width:1px;"></path><text x="180.0" y="96.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;paint-order:stroke;">courbe, demi-pointe</text><text x="180.0" y="114.0" text-anchor="start" style="fill:rgb(15, 143, 126);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;paint-order:stroke;">déplace 1 électron</text><text x="660.0" y="104.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:end;paint-order:stroke;">un électron seul bouge</text><rect x="8" y="134" width="664" height="54" rx="12" style="fill:rgb(255, 255, 255);stroke:rgb(230, 223, 210);stroke-width:1px;"></rect><path d="M40 156 H150 l-10 -7" stroke-width="2.6" fill="none" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;"></path><path d="M150 166 H40 l10 7" stroke-width="2.6" fill="none" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;"></path><text x="180.0" y="158.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;paint-order:stroke;">⇌ deux demi-flèches</text><text x="180.0" y="176.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;paint-order:stroke;">réaction équilibrée</text><text x="660.0" y="166.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:end;paint-order:stroke;">dans les deux sens à la fois</text><rect x="8" y="196" width="664" height="54" rx="12" style="fill:rgb(255, 255, 255);stroke:rgb(230, 223, 210);stroke-width:1px;"></rect><path d="M50 223 H142" stroke-width="2.6" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(124, 77, 219);stroke-width:2.6px;marker-end:url(&quot;#fzar&quot;);"></path><path d="M40 223 l14 -7 v14z" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></path><text x="180.0" y="220.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;paint-order:stroke;">↔ deux pointes</text><text x="180.0" y="238.0" text-anchor="start" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;paint-order:stroke;">mésomérie : même molécule</text><text x="660.0" y="228.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:end;paint-order:stroke;">ce n'est pas une réaction !</text><rect x="8" y="258" width="664" height="54" rx="12" style="fill:rgb(255, 255, 255);stroke:rgb(230, 223, 210);stroke-width:1px;"></rect><path d="M40 285 H146" stroke-width="2.8" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(216, 72, 61);stroke-width:2.8px;marker-end:url(&quot;#fzar&quot;);"></path><text x="180.0" y="282.0" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;paint-order:stroke;">→ une flèche</text><text x="180.0" y="300.0" text-anchor="start" style="fill:rgb(216, 72, 61);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13.5px;font-weight:800;paint-order:stroke;">réaction irréversible</text><text x="660.0" y="290.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:end;paint-order:stroke;">un seul sens</text></svg>