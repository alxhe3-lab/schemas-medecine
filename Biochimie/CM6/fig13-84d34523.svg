<svg viewBox="0 0 600 190" role="img" aria-label="Thèmes des annales" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="600" height="190"><rect x="0" y="0" width="600" height="190" rx="14" fill="#ffffff"></rect><text x="10" y="36" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">Glycolyse</text><rect x="170" y="18" width="256" height="26" rx="8" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="440" y="37" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">8 · parties 5 à 8</text><text x="10" y="92" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">Régulation</text><rect x="170" y="74" width="224" height="26" rx="8" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><text x="408" y="93" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">7 · parties 9 et 12</text><text x="10" y="148" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">Néoglucogenèse</text><rect x="170" y="130" width="320" height="26" rx="8" style="fill:rgb(241, 234, 250);stroke:rgb(116, 66, 184);stroke-width:2px;"></rect><text x="504" y="149" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">10 · 10 à 12</text><text x="10" y="182" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">Un cours sur trois parties de questions : les enzymes, ce qui les règle, le chemin inverse.</text></svg>