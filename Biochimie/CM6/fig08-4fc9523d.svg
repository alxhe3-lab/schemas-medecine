ose</text><text x="340.0" y="290.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">le bilan en ATP est celui de toute la dégradation du glucose</text></svg>