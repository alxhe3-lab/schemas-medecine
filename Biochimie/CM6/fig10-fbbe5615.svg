<svg style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" viewBox="0 0 680 360" role="img" aria-label="Les trois détours de la néoglucogenèse" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="680" height="360"><rect x="0" y="0" width="680" height="360" rx="14" fill="#ffffff"></rect><text x="170.0" y="24.0" text-anchor="middle" style="fill:rgb(31, 157, 85);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:14px;font-weight:800;text-anchor:middle;paint-order:stroke;">Glycolyse ↓</text><text x="470.0" y="24.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:14px;font-weight:800;text-anchor:middle;paint-order:stroke;">Néoglucogenèse ↑</text><text x="320.0" y="64.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;text-anchor:middle;paint-order:stroke;">Glucose</text><text x="320.0" y="124.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;text-anchor:middle;paint-order:stroke;">Glucose-6-P</text><path d="M290 72 V108" stroke-width="2.6" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(31, 157, 85);stroke-width:2.6px;marker-end:url(&quot;#fzar&quot;);"></path><path d="M350 108 C400 104 400 76 350 72" stroke-width="2.6" fill="none" marker-end="url(#fzar)" style="fill:none;stroke:rgb(44, 102, 204);stroke-width:2.6px;marker-end:url(&quot;#fzar&quot;);"></path><path d="M296 90 h18" stroke-width="3" style="fill:rgb(0, 0, 0);stroke:rgb(216, 72, 61);stroke-width:3px;"></path><text x="280.0" y="94.0" text-anchor="end" style="fill:rgb(31, 157, 85);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:end;paint-order:stroke;">hexokinase / glucokinase</text><text x="408.0" y="94.0" text-anchor="start" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;paint-order:stroke;">glucose-6-phosphatase</text><path d="M320 136 V152" stroke-width="1.6" stroke-dasharray="3 3" style="fill:rgb(0, 0, 0);stroke:rgb(94, 102, 119);stroke-width:1.6px;stroke-dasharray:3px, 3px;"></path><text x="320.0" y="164.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;text-anchor:middle;paint-order:stroke;">Fructose-6-P</text><text x="320.0" y="224.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;text-anchor:middle;paint-order:stroke;">Fructose-1,6-BP</text><path d="M290 172 V208" stroke-width="2.6" marker-end="url(#fzar)" style="fill:rgb(0, 0, 0);stroke:rgb(31, 157, 85);stroke-width:2.6px;marker-end:url(&quot;#fzar&quot;);"></path><path d="M350 208 C400 204 400 176 350 172" stroke-width="2.6" fill="none" marker-end="url(#fzar)" style="fill:none;stroke:rgb(44, 102, 204);stroke-width:2.6px;marker-end:url(&quot;#fzar&quot;);"></path><path d="M296 190 h18" stroke-width="3" style="fill:rgb(0, 0, 0);stroke:rgb(216, 72, 61);stroke-width:3px;"></path><text x="280.0" y="194.0" text-anchor="end" style="fill:rgb(31, 157, 85);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:end;paint-order:stroke;">PFK-1</text><text x="408.0" y="194.0" text-anchor="start" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;paint-order:stroke;">fructose-1,6-bisphosphatase</text><path d="M320 236 V252" stroke-width="1.6" stroke-dasharray="3 3" style="fill:rgb(0, 0, 0);stroke:rgb(94, 102, 119);stroke-width:1.6px;stroke-dasharray:3px, 3px;"></path><text 