<svg viewBox="0 0 560 200" role="img" aria-label="Voie des polyols" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="560" height="200"><rect x="0" y="0" width="560" height="200" rx="14" fill="#ffffff"></rect> <rect x="20" y="70" width="110" height="50" rx="14" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></rect><text x="75" y="100" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">glucose</text> <path d="M132 95 L212 95" fill="none" style="fill:none;stroke:rgb(20, 120, 168);stroke-width:3px;"></path><path d="M212 95 L203.9 98.9 L203.9 91.1 z" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></path><text x="172" y="60" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">aldose réductase</text><text x="172" y="130" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">NADPH → NADP⁺</text> <rect x="216" y="70" width="120" height="50" rx="14" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="276" y="100" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">sorbitol</text> <path d="M338 95 L420 95" fill="none" style="fill:none;stroke:rgb(37, 71, 166);stroke-width:3px;"></path><path d="M420 95 L411.9 98.9 L411.9 91.1 z" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></path><text x="379" y="60" text-anchor="middle" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">sorbitol DH</text><text x="379" y="130" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-