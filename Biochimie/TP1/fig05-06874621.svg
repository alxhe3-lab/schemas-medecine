<svg style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" viewBox="0 0 680 250" role="img" aria-label="Hypo, iso, hypertonique par rapport au plasma" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="680" height="250"><rect x="0" y="0" width="680" height="250" rx="14" fill="#ffffff"></rect><defs style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><linearGradient id="fzgos" x1="0" x2="1" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><stop offset="0" stop-color="#7fb6ea" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"></stop><stop offset=".5" stop-color="#e7e2d6" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"></stop><stop offset="1" stop-color="#b48be0" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"></stop></linearGradient></defs><rect x="40" y="140" width="600" height="18" rx="9" fill="url(#fzgos)" style="fill:url(&quot;#fzgos&quot;);stroke:none;stroke-width:1px;"></rect><rect x="300" y="132" width="80" height="34" rx="8" fill="none" stroke-width="3" style="fill:none;stroke:rgb(44, 102, 204);stroke-width:3px;"></rect><text x="40.0" y="186.0" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;paint-order:stroke;">0 : eau pure</text><text x="340.0" y="186.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:13px;font-weight:800;text-anchor:middle;paint-order:stroke;">290–300 mOsm/L</text><text x="340.0" y="202.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">le plasma</text><text x="640.0" y="186.0" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12px;font-weight:800;text-anchor:end;paint-order:stroke;">mOsm/L →</text><text x="160.0" y="24.0" text-anchor="middle" style="fill:rgb(15, 143, 126);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:14.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">hypotonique</text><text x="160.0" y="40.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">moins de particules</text><ellipse cx="160.0" cy="82.0" rx="28.0" ry="25.8" stroke-width="1.5" style="fill:rgb(192, 36, 44);stroke:rgb(167, 47, 38);stroke-width:1.5px;"></ellipse><ellipse cx="160.0" cy="82.0" rx="12.6" ry="11.2" opacity=".85" style="fill:rgb(243, 154, 143);stroke:none;stroke-width:1px;opacity:0.85;"></ellipse><text x="160.0" y="124.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">il gonfle, puis éclate</text><text x="340.0" y="24.0" text-anchor="middle" style="fill:rgb(44, 102, 204);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:14.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">isotonique</text><text x="340.0" y="40.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">≈ plasma</text><ellipse cx="340.0" cy="82.0" rx="22.0" ry="20.2" stroke-width="1.5" style="fill:rgb(192, 36, 44);stroke:rgb(167, 47, 38);stroke-width:1.5px;"></ellipse><ellipse cx="340.0" cy="82.0" rx="9.9" ry="8.8" opacity=".85" style="fill:rgb(243, 154, 143);stroke:none;stroke-width:1px;opacity:0.85;"></ellipse><text x="340.0" y="124.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">il reste normal</text><text x="520.0" y="24.0" text-anchor="middle" style="fill:rgb(124, 77, 219);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:14.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">hypertonique</text><text x="520.0" y="40.0" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">plus de particules</text><ellipse cx="520.0" cy="82.0" rx="17.0" ry="15.6" stroke-width="1.5" style="fill:rgb(192, 36, 44);stroke:rgb(167, 47, 38);stroke-width:1.5px;"></ellipse><ellipse cx="520.0" cy="82.0" rx="7.7" ry="6.8" opacity=".85" style="fill:rgb(243, 154, 143);stroke:none;stroke-width:1px;opacity:0.85;"></ellipse><text x="520.0" y="124.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:11.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">il se ratatine</text><circle cx="520" cy="82" r="20" fill="none" stroke-width="1.6" stroke-dasharray="3 3" style="fill:none;stroke:rgb(124, 77, 219);stroke-width:1.6px;stroke-dasharray:3px, 3px;"></circle><text x="340.0" y="236.0" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:rgb(243, 246, 251);stroke-width:4.5px;stroke-linejoin:round;font-size:12.5px;font-weight:800;text-anchor:middle;paint-order:stroke;">l'eau va du côté le moins concentré vers le plus concentré</text></svg>