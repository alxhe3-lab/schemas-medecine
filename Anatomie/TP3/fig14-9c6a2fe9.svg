<svg viewBox="0 0 640 300" role="img" aria-label="Ce que la ligne arquée sépare sur la face interne" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="300"><rect x="0" y="0" width="640" height="300" rx="14" fill="#ffffff"></rect><rect x="10" y="10" width="620" height="280" rx="18" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></rect><path d="M24 200 L616 150" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;"></path><text x="600" y="186" text-anchor="end" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:end;">ligne arquée</text><rect x="30" y="30" width="270" height="74" rx="12" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="165" y="60" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">en avant : fosse iliaque</text><text x="165" y="84" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;text-anchor:middle;">→ muscle iliaque</text><rect x="320" y="30" width="300" height="74" rx="12" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><text x="470" y="60" text-anchor="middle" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">en arrière : surface auriculaire</text><text x="470" y="84" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:400;text-anchor:middle;">→ s’articule avec le sacrum</text><text x="470" y="128" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">au-dessus d’elle : tubérosité iliaque</text><rect x="60" y="216" width="520" height="62" rx="12" style="fill:rgb(241, 234, 250);stroke:rgb(116, 66, 184);stroke-width:2px;"></rect><text x="320" y="242" text-anchor="middle" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">au-dessous : obturateur interne · diaphragme pelvien</text><text x="320" y="264" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">(élévateur de l’anus, coccygien)</text><circle cx="32" cy="32" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="32" y="36.5" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">1</text><circle cx="322" cy="32" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="322" y="36.5" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">2</text><circle cx="62" cy="218" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="62" y="222.5" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">3</text></svg>