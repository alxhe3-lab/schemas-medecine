ula)</text><text x="320" y="190" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">semi-tendineux · semi-membraneux · biceps fémoral</text></svg>