<svg viewBox="0 0 640 280" role="img" aria-label="Le pied en trois groupes" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="280"><rect x="0" y="0" width="640" height="280" rx="14" fill="#ffffff"></rect><rect x="250" y="10" width="140" height="44" rx="14" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></rect><text x="320" y="38" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Pied : 26 os</text><path d="M320 54 L110 88 M320 54 L320 88 M320 54 L530 88" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;"></path><rect x="10" y="88" width="200" height="54" rx="12" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="110" y="112" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Tarse : 7</text><text x="110" y="132" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">le lien avec la jambe</text><rect x="250" y="88" width="140" height="54" rx="12" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><text x="320" y="112" text-anchor="middle" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Métatarse : 5</text><text x="320" y="132" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">I à V</text><rect x="430" y="88" width="200" height="54" rx="12" style="fill:rgb(241, 234, 250);stroke:rgb(116, 66, 184);stroke-width:2px;"></rect><text x="530" y="112" text-anchor="middle" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Phalanges : 14</text><text x="530" y="132" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">3 par orteil, 2 à l’hallux</text><path d="M110 142 L60 176 M110 142 L170 176" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;"></path><rect x="8" y="176" width="104" height="90" rx="12" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="60" y="198" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">postérieur : 2</text><text x="60" y="222" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">talus (haut)</text><text x="60" y="242" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">calcanéus</text><rect x="120" y="176" width="140" height="90" rx="12" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="190" y="198" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">antérieur : 5</text><text x="190" y="222" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">naviculaire, cuboïde</text><text x="190" y="242" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">3 cunéiformes</text><circle cx="300" cy="220" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="300" y="224.5" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">7</text><text x="318" y="225" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">+ 5 + 14 = 26</text></svg>