<svg viewBox="0 0 640 300" role="img" aria-label="Les trois loges de la cuisse, en coupe" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="300"><rect x="0" y="0" width="640" height="300" rx="14" fill="#ffffff"></rect><ellipse cx="300" cy="150" rx="200" ry="130" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></ellipse><path d="M300 150 L130 82 A200 130 0 0 1 470 82 Z" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></path><path d="M300 150 L470 82 A200 130 0 0 1 300 280 Z" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></path><path d="M300 150 L300 280 A200 130 0 0 1 130 82 Z" style="fill:rgb(241, 234, 250);stroke:rgb(116, 66, 184);stroke-width:2px;"></path><circle cx="300" cy="150" r="26" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></circle><text x="300" y="155" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">fémur</text><text x="300" y="60" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">antérieure : extenseurs</text><text x="300" y="80" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">(quadriceps)</text><text x="410" y="190" text-anchor="middle" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">postérieure :</text><text x="410" y="210" text-anchor="middle" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">fléchisseurs</text><text x="196" y="190" text-anchor="middle" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight