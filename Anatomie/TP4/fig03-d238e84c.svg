<svg viewBox="0 0 640 260" role="img" aria-label="Angle du col du fémur" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="260"><rect x="0" y="0" width="640" height="260" rx="14" fill="#ffffff"></rect><path d="M360 250 L360 120" style="fill:none;stroke:rgb(37, 71, 166);stroke-width:3px;"></path><text x="348" y="240" text-anchor="end" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:end;">axe de la diaphyse</text><path d="M360 120 L250 46" style="fill:none;stroke:rgb(20, 120, 168);stroke-width:3px;"></path><text x="292" y="62" text-anchor="start" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">axe du col</text><circle cx="236" cy="38" r="22" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></circle><text x="206" y="34" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:end;">tête :</text><text x="206" y="52" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:end;">en haut, médiale</text><path d="M360 160 A40 40 0 0 0 327 98" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;"></path><text x="300" y="150" text-anchor="end" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:end;">125°</text><rect x="380" y="70" width="60" height="44" rx="14" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></rect><text x="450" y="90" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">grand trochanter</text><text x="450" y="108" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">latéral</text><path d="M470 160 L549.0 160.0" style="fill:none;stroke:rgb(116, 66, 184);stroke-width:3px;"></path><polygon points="560,160 549.0,166.0 549.0,154.0" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;"></polygon><text x="460" y="190" text-anchor="start" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">antéversion 10–15° :</text><text x="460" y="208" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">col et tête tournés</text><text x="460" y="226" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">un peu vers l’avant</text><text x="40" y="250" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">médial</text><text x="620" y="250" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:end;">latéral</text></svg>