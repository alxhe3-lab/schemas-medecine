<svg viewBox="0 0 640 340" role="img" aria-label="Le trajet de la ligne âpre" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="340"><rect x="0" y="0" width="640" height="340" rx="14" fill="#ffffff"></rect><text x="40" y="52" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">tiers proximal</text><text x="40" y="160" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">tiers moyen</text><text x="40" y="280" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">tiers distal</text><path d="M300 20 L320 110" style="fill:none;stroke:rgb(20, 120, 168);stroke-width:3px;"></path><path d="M360 20 L340 110" style="fill:none;stroke:rgb(116, 66, 184);stroke-width:3px;"></path><text x="290" y="38" text-anchor="end" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:end;">lèvre médiale</text><text x="370" y="38" text-anchor="start" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">lèvre latérale</text><text x="290" y="58" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:end;">→ vaste médial</text><text x="370" y="58" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">→ vaste latéral, biceps (chef court)</text><path d="M330 110 L330 210" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;"></path><text x="345" y="165" text-anchor="start" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">une seule ligne, rugueuse</text><path d="M330 210 L240 316" style="fill:none;stroke:rgb(20, 120, 168);stroke-width:3px;"></path><path d="M330 210 L420 316" style="fill:none;stroke:rgb(116, 66, 184);stroke-width:3px;"></path><path d="M330 236 L262 310 L398 310 Z" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></path><text x="330" y="296" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">surface poplitée</text><text x="236" y="334" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:end;">supracondylaire médiale</text><text x="424" y="334" text-anchor="start" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">latérale</text><path d="M620 90 L620.0 289.0" style="fill:none;stroke:rgb(94, 102, 119);stroke-width:1.3px;"></path><polygon points="620,300 614.0,289.0 626.0,289.0" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></polygon><text x="612" y="84" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:end;">haut</text><text x="612" y="320" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:end;">bas</text><circle cx="330" cy="110" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="330" y="114.5" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">1</text><circle cx="330" cy="210" r="11" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="330" y="214.5" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">2</text></svg>