<svg viewBox="0 0 640 250" role="img" aria-label="Radius et ulna tête-bêche" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="250"><rect x="0" y="0" width="640" height="250" rx="14" fill="#ffffff"></rect> <text x="160" y="24" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Radius (dehors, pouce)</text><text x="480" y="24" text-anchor="middle" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Ulna (dedans, petit doigt)</text> <rect x="70" y="40" width="180" height="50" rx="12" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="160" y="70" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">tête, en haut</text> <rect x="390" y="40" width="180" height="50" rx="12" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><text x="480" y="62" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">extrémité volumineuse</text><text x="480" y="80" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">olécrâne, coronoïde</text> <path d="M160 90 V160" style="fill:none;stroke:rgb(20, 120, 168);stroke-width:3px;"></path><path d="M480 90 V160" style="fill:none;stroke:rgb(37, 71, 166);stroke-width:3px;"></path> <path d="M250 125 H390" style="fill:none;stroke:rgb(94, 102, 119);stroke-width:1px;stroke-dasharray:3px, 4px;"></path><text x="320" y="118" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">membrane interosseuse</text> <rect x="70" y="160" width="180" height="50" rx="12" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="160" y="182" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">extrémité large</text><text x="160" y="200" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">touche le carpe directement</text> <rect x="390" y="160" width="180" height="50" rx="12" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><text x="480" y="182" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">tête, en bas</text><text x="480" y="200" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">un disque la sépare du carpe</text> <path d="M300 236 H340" style="fill:none;stroke:rgb(94, 102, 119);stroke-width:1.3px;"></path><path d="M336 230 l10 6 l-10 6 z" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></path><text x="290" y="240" text-anchor="end" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:end;">haut et bas inversés :</text><text x="352" y="240" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">tête-bêche</text> </svg>