<svg viewBox="0 0 640 250" role="img" aria-label="Origine fixe, terminaison mobile" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="250"><rect x="0" y="0" width="640" height="250" rx="14" fill="#ffffff"></rect> <rect x="20" y="30" width="150" height="56" rx="12" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="95" y="56" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Origine</text><text x="95" y="76" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">point fixe (scapula)</text> <path d="M170 58 C260 58 300 120 330 160" style="fill:none;stroke:rgb(37, 71, 166);stroke-width:12px;stroke-linecap:round;"></path><text x="236" y="108" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">le muscle</text> <rect x="320" y="160" width="170" height="56" rx="12" style="fill:rgb(241, 234, 250);stroke:rgb(116, 66, 184);stroke-width:2px;"></rect><text x="405" y="186" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Terminaison</text><text x="405" y="206" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">point mobile (radius)</text> <path d="M392 150 C370 110 300 90 210 80" style="fill:none;stroke:rgb(116, 66, 184);stroke-width:3px;"></path><path d="M216 73 l-12 6 l12 6 z" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;"></path> <text x="510" y="80" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">En se contractant</text><text x="510" y="102" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">le muscle raccourcit</text><text x="510" y="122" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">et tire la terminaison</text><text x="510" y="142" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">vers l'origine</text> <text x="20" y="240" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">exemple : le biceps, de la scapula au radius, rapproche l'avant-bras de l'épaule : il plie le coude</text> </svg>