<svg viewBox="0 0 640 225" role="img" aria-label="Le stock d'ovocytes" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="225"><rect x="0" y="0" width="640" height="225" rx="14" fill="#ffffff"></rect><path d="M20 150 L611 150" style="fill:none;stroke:rgb(94, 102, 119);stroke-width:1.3px;"></path><polygon points="620,150 611,155 611,145" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></polygon><path d="M60 144 V156" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;"></path><text x="60" y="176" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Fœtus (5 mois)</text><path d="M220 144 V156" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;"></path><text x="220" y="176" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Naissance</text><path d="M400 144 V156" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;"></path><text x="400" y="176" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Puberté</text><path d="M580 144 V156" style="fill:none;stroke:rgb(20, 26, 38);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;"></path><text x="580" y="176" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Ménopause</text><rect x="40" y="30" width="40" height="110" rx="4" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="60" y="22" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">7 millions</text><rect x="200" y="90" width="40" height="50" rx="4" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="220" y="82" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">0,7 à 2 M</text><rect x="380" y="128" width="40" height="12" rx="4" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="400" y="120" text-anchor="middle" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">40 000</text><rect x="570" y="138" width="20" height="2" rx="1" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="580" y="128" text-anchor="middle" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">épuisé</text><text x="310" y="212" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">le stock ne fait que diminuer : aucune ovogonie après la naissance</text></svg>