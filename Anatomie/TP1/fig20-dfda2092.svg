<svg viewBox="0 0 640 220" role="img" aria-label="La clavicule entre le sternum et l'acromion" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="220"><rect x="0" y="0" width="640" height="220" rx="14" fill="#ffffff"></rect> <rect x="10" y="60" width="70" height="110" rx="12" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></rect><text x="45" y="190" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">sternum</text> <path d="M82 110 C170 70 240 140 330 110 C420 80 470 110 540 96" style="fill:none;stroke:rgb(37, 71, 166);stroke-width:14px;stroke-linecap:round;"></path> <rect x="548" y="70" width="84" height="56" rx="12" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></rect><text x="590" y="148" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">acromion</text> <circle cx="100" cy="104" r="12" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="100" y="109" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">1</text> <circle cx="528" cy="98" r="12" style="fill:rgb(255, 255, 255);stroke:rgb(20, 26, 38);stroke-width:2px;"></circle><text x="528" y="103" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:13px;font-weight:800;text-anchor:middle;">2</text> <text x="100" y="40" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">1 · Extrémité proximale = sternale</text><text x="100" y="60" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">s'articule avec le sternum</text> <text x="330" y="168" style="fill:rgb(116, 66, 184);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;">2 · Extrémité distale = acromiale</text><text x="330" y="188" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;">s'articule avec l'acromion de la scapula</text> <text x="250" y="210" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">◀ près de l'axe (proximal) · loin de l'axe (distal) ▶</text> </svg>