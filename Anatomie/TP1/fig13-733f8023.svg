<svg viewBox="0 0 640 220" role="img" aria-label="Crâne, atlas, axis : qui s'articule avec qui" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" width="640" height="220"><rect x="0" y="0" width="640" height="220" rx="14" fill="#ffffff"></rect> <rect x="10" y="70" width="130" height="70" rx="14" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></rect><text x="75" y="98" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Os occipital</text><text x="75" y="120" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">base du crâne</text> <path d="M140 105 H178" style="fill:none;stroke:rgb(20, 120, 168);stroke-width:3px;"></path><path d="M174 99 l10 6 l-10 6 z" style="fill:rgb(20, 120, 168);stroke:none;stroke-width:1px;"></path><text x="160" y="94" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">condyles</text> <rect x="186" y="60" width="140" height="90" rx="14" style="fill:rgb(226, 241, 248);stroke:rgb(20, 120, 168);stroke-width:2px;"></rect><text x="256" y="90" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Atlas · C1</text><text x="256" y="112" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">anneau, pas de corps</text><text x="256" y="132" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">arcs antérieur, postérieur</text> <path d="M326 105 H364" style="fill:none;stroke:rgb(37, 71, 166);stroke-width:3px;"></path><path d="M360 99 l10 6 l-10 6 z" style="fill:rgb(37, 71, 166);stroke:none;stroke-width:1px;"></path><text x="346" y="94" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">dent</text> <rect x="372" y="60" width="140" height="90" rx="14" style="fill:rgb(231, 237, 251);stroke:rgb(37, 71, 166);stroke-width:2px;"></rect><text x="442" y="90" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">Axis · C2</text><text x="442" y="112" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">porte la dent</text><text x="442" y="132" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">qui monte dans l'atlas</text> <path d="M512 105 H550" style="fill:none;stroke:rgb(94, 102, 119);stroke-width:1.3px;"></path><path d="M546 99 l10 6 l-10 6 z" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;"></path> <rect x="558" y="70" width="72" height="70" rx="14" style="fill:rgb(221, 228, 238);stroke:rgb(94, 102, 119);stroke-width:1.2px;"></rect><text x="594" y="110" text-anchor="middle" style="fill:rgb(20, 26, 38);stroke:none;stroke-width:1px;font-size:14px;font-weight:700;text-anchor:middle;">C3</text> <text x="320" y="190" text-anchor="middle" style="fill:rgb(94, 102, 119);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;text-anchor:middle;">chaque flèche = une articulation, de haut en bas</text> </svg>